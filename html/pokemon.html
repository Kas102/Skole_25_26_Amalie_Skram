<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokedex</title>

  <style>
    body {
      background: linear-gradient(90deg,rgba(250, 158, 0, 1) 11%,rgba(255, 236, 66, 1) 96%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .main {
      width: 600px;
      background-color: white;
      border-radius: 16px;
      text-align: center;
      padding: 20px;
    }

    #pokemon {
      min-height: 300px;
    }

    input {
      padding: 10px;
      border-radius: 4px;
    }

    button {
      padding: 10px;
      border-radius: 4px;
      background-color: rgb(0, 0, 0);
      color: white;
      border: none;
      cursor: pointer;
    }

    img {
      width: 150px;
    }
  </style>
</head>

<body>
  <div class="main">
    <h1>Pokedex</h1>

    <input id="name" placeholder="Skriv pokemon-navn" />
    <button id="myBtn">Søk</button>
    <button id="randomBtn">Random</button>

    <div id="pokemon"></div>
  </div>

  <script>
    const input = document.getElementById("name");
    const pokemonDiv = document.getElementById("pokemon");

    // Enter-tast
    input.addEventListener("keypress", function (event) {
      if (event.key === "Enter") {
        document.getElementById("myBtn").click();
      }
    });

    // Render-funksjon (brukes av begge)
    function displayPokemon(data) {
      const name =
        data.name.charAt(0).toUpperCase() + data.name.slice(1);

      pokemonDiv.innerHTML = `
        <h2>${name}</h2>
        <img src="${data.sprites.front_default}" alt="${name}">
        <p>Høyde: ${data.height}</p>
        <p>Vekt: ${data.weight}</p>
      `;
    }

    // Søk på navn
    async function search() {
      const name = input.value.toLowerCase();

      const response = await fetch(
        "https://pokeapi.co/api/v2/pokemon/" + name
      );

      if (!response.ok) {
        pokemonDiv.innerHTML = `
          <p>Vi kunne ikke finne pokemonen <b>${name}</b> i listen</p>
        `;
        return;
      }

      const data = await response.json();
      displayPokemon(data);
    }

    // Random Pokémon
    async function fetchRandomPokemon() {
      const countRes = await fetch(
        "https://pokeapi.co/api/v2/pokemon"
      );
      const { count } = await countRes.json();

      const randomId = Math.floor(Math.random() * count) + 1;

      const res = await fetch(
        `https://pokeapi.co/api/v2/pokemon/${randomId}`
      );
      return res.json();
    }

    async function randomPokemon() {
      const pokemon = await fetchRandomPokemon();
      displayPokemon(pokemon);
    }

    // Event listeners
    document.getElementById("myBtn").addEventListener("click", search);
    document
      .getElementById("randomBtn")
      .addEventListener("click", randomPokemon);
  </script>
</body>
</html>
