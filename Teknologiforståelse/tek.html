<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Interaktiv Nettverkshistorie</title>

<style>

body{
font-family: Arial;
background:#0f172a;
color:white;
text-align:center;
padding:40px;
}

#game{
max-width:900px;
margin:auto;
background:#1e293b;
padding:30px;
border-radius:10px;
}

button{
margin:10px;
padding:10px 20px;
font-size:16px;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#38bdf8;
}

#score{
font-size:20px;
margin-bottom:20px;
color:#38bdf8;
}

</style>
</head>

<body>

<div id="game">

<h1>Nettverksbyen</h1>

<div id="score">
Nettverkspoeng: <span id="points">0</span>
</div>

<p id="story"></p>

<div id="choices"></div>

</div>


<script>

let node = "start"
let points = 0


function addPoints(p){
points += p
document.getElementById("points").innerText = points
}


function update(){

const story = document.getElementById("story")
const choices = document.getElementById("choices")
choices.innerHTML = ""


/* ---------------- START ---------------- */

if(node === "start"){

story.innerText = `
I denne historien så er ditt navn Alex, en nesten helt vanlig person. Du liker spesielt godt og se serier, game og scrolle på mobilen akkurat slik som andre ungdommer. En dag slutter internettet ditt og funker og ruteren blinker rødt. Du sukker frustrert, men så plutselig åpner det seg en digital portal foran deg og ut kommer en liten svevende blå skapning.
‘Hei, jeg er IP, vokteren av nettverket ditt, nettverket ditt er i kaos og bare DU kan hjelpe oss’
Direkte etter blir sugd med inn i den digitale verden.

`

let btn = document.createElement("button")
btn.innerText = "Start historien"
btn.onclick = ()=>{ node="kap1"; update(); }

choices.appendChild(btn)

}


/* ---------------- KAPITTEL 1 ---------------- */

else if(node === "kap1"){

story.innerText = `
Med et hard smell lander du på bakken omgitt av en by full av enheter mobiler, PCer, printere og alt annet elektronisk du kan tenke deg. Ved siden av deg dukker IP opp som sier til deg “For at du skal kunne overleve her må du forstå hvordan IP-adresser fungerer. Hver enhet her har en unik ip-adresse akkurat slik som husene i din verden har en unik gateadresse” Han peker på en bygning ved siden av veien og sier 192.168.1.23. Dette er da en ipv4-adresse den er delt opp i 32 bitter. Du er helt forvirret og skjønner ingenting
IP fortsetter ‘I det siste har det flyttet inn mange nye familier her, men det gjør jo slik at ikke alle husene her kommer til å ha en unik ipv4-adresse derfor skal vi nå finne en ny løsning’

`

let c1 = document.createElement("button")
c1.innerText = "Hjelp ip"
c1.onclick = ()=>{
addPoints(1)
node="node2"
update()
}

let c2 = document.createElement("button")
c2.innerText = "Ignorer problemet"
c2.onclick = ()=>{
node="router"
update()
}

choices.appendChild(c1)
choices.appendChild(c2)

}


/* ---------------- NODE 2 ---------------- */

else if(node === "node2"){

story.innerText = `
Du sier ja og velger å prøve og hjelpe IP med å finne en måte slik at alle kan ha unike ip-adresser. Dere velger å dra til sentrum av byen for å finne ideer til hva dere kan finne på. Der møter dere en person som kaller seg selv for DHCP-mesteren og han sier at hans ansvar er og gi ulike hus ip-adresser. Han forteller om hvordan systemet nå har blitt fullt og at han ikke har mulighet til å dele ut flere ip-adresser. Han forteller også om en ny type ip-adresse som han kaller for ipv6 som skal kunne ha 128 bitter i en ip-adresse. Men han sier også at byen ikke bare handler om antall adresser og legger et kart over byen ned på bordet se her byen deres er alt for dårlig organisert. Så snur DHCP og ser på deg “Kan du hjelpe oss” du kan enten bruke subnett for å prøve og dele opp nettverket, bytte til ipv6 eller bare la alt være som det er nå. Valget er ditt.
`

let c1 = document.createElement("button")
c1.innerText = "Bruk subnett"
c1.onclick = ()=>{
addPoints(2)
node="subnet"
update()
}

let c2 = document.createElement("button")
c2.innerText = "Bytt til IPv6"
c2.onclick = ()=>{
addPoints(3)
node="ipv6"
update()
}

choices.appendChild(c1)
choices.appendChild(c2)

}


/* ---------------- SUBNETT ---------------- */

else if(node === "subnet"){

story.innerText = `
IP nikker og ser på kartet over byen som DHCP akkurat viste frem.
Så sier IP brådt “når vi bruker subnett deler vi nettverket opp i mindre områder. Da blir trafikken lettere å kontrollere, og færre enheter som krangler om samme plass."
Han tegner streker med en rød penn fort over kartet.
"Men vi må være forsiktige fordi hvis vi velger feil subnett kan det bli enten bli altfor stort eller for lite."

`

let c1 = document.createElement("button")
c1.innerText = "/24"
c1.onclick = ()=>{
addPoints(3)
node="router"
update()
}

let c2 = document.createElement("button")
c2.innerText = "/16"
c2.onclick = ()=>{
addPoints(1)
node="router"
update()
}

let c3 = document.createElement("button")
c3.innerText = "/8"
c3.onclick = ()=>{
node="badend"
update()
}

choices.appendChild(c1)
choices.appendChild(c2)
choices.appendChild(c3)

}


/* ---------------- IPV6 ---------------- */

else if(node === "ipv6"){

story.innerText = `
Du op IP blir med inn på kontoret til DHCP “ipv4 adressene er overfylt. Vi kan velge å oppgradere til ipv6 som da vil gi oss 128 bit adresser og generelt mange flere adresser. Men jeg er fortsatt ikke helt sikker på hva jeg skal gjøre”
`

let c1 = document.createElement("button")
c1.innerText = "Kun IPv6"
c1.onclick = ()=>{
addPoints(3)
node="router"
update()
}

let c2 = document.createElement("button")
c2.innerText = "IPv4 + IPv6"
c2.onclick = ()=>{
addPoints(2)
node="router"
update()
}

let c3 = document.createElement("button")
c3.innerText = "Ingen organisering"
c3.onclick = ()=>{
node="badend"
update()
}

choices.appendChild(c1)
choices.appendChild(c2)
choices.appendChild(c3)

}


/* ---------------- ROUTER ---------------- */

else if(node === "router"){

story.innerText = `
Du prøver å finne portalen hjem, men møter en mystisk robot på et svevende rullebrett.
 “Jeg er Router, vokteren av portalen. For å komme hjem må du først forstå IP-konflikter,” sier han.
`

let c1 = document.createElement("button")
c1.innerText = "Lær om IP-konflikt"
c1.onclick = ()=>{
node="conflict"
update()
}

let c2 = document.createElement("button")
c2.innerText = "Gi opp"
c2.onclick = ()=>{
node="badend"
update()
}

choices.appendChild(c1)
choices.appendChild(c2)

}


/* ---------------- IP KONFLIKT ---------------- */

else if(node === "conflict"){

story.innerText = `
Routervokteren viser deg en skjerm over nettverksbyen på den kan du se to hus som blinker rødt “Begge disse husene har samme ip-adresse og det skaper ip konflikt” sier Router. DU blir nødt til å hjelpe oss med å finne en løsning fordi vi står mellom tre ulike valg og det er og bruke DHCP, sette in ip manuelt eller kan du velge og ignorere problemet. Valget er ditt.
`

let c1 = document.createElement("button")
c1.innerText = "Bruk DHCP"
c1.onclick = ()=>{
addPoints(3)
node="goodend"
update()
}

let c2 = document.createElement("button")
c2.innerText = "Sett IP manuelt"
c2.onclick = ()=>{
addPoints(1)
node="midend"
update()
}

let c3 = document.createElement("button")
c3.innerText = "Ignorer problemet"
c3.onclick = ()=>{
node="badend"
update()
}

choices.appendChild(c1)
choices.appendChild(c2)
choices.appendChild(c3)

}


/* ---------------- SLUTTER ---------------- */

else if(node === "goodend"){

story.innerText = `
Du løser ip konflikten og husene slutter å blinke rødt. Alle enheter har fått hver sin ip-adresse og hele nettverket fungerer igjen. Portalen åpner seg og du returnerer tilbake til din verden.
`

}

else if(node === "midend"){

story.innerText = `
Du greier og fikse noen problemer, men ikke i nærheten av alle. Nettverket funker men er ikke optimalisert. Portalen åpnes og du returnerer til din verden internettet ditt funker, men det er ofte tregt.
`

}

else if(node === "badend"){

story.innerText = `
Hele nettverket ditt er i kaos, flere enheter har samme ip-adresse og portalen blir ikke åpnet så du vil sitte fast i nettverksbyen i all evighet.
`

}

}

update()

</script>

</body>
</html>
