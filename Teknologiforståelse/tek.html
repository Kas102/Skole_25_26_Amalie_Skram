<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Alex og Nettverksbyen</title>




<style>




body{
font-family: Arial;
background:#0b0f1a;
color:white;
text-align:center;
padding:40px;
}




#game{
max-width:800px;
margin:auto;
background:#1a2138;
padding:30px;
border-radius:10px;
}




button{
padding:12px 20px;
margin:10px;
border:none;
border-radius:6px;
background:#3b82f6;
color:white;
font-size:16px;
cursor:pointer;
}




button:hover{
background:#2563eb;
}




#stats{
margin-top:20px;
font-size:18px;
}




#networkBar{
width:100%;
height:20px;
background:#333;
margin-top:20px;
border-radius:10px;
overflow:hidden;
}




#traffic{
height:100%;
width:20%;
background:lime;
transition:0.5s;
}




</style>
</head>




<body>




<div id="game">




<h1>Alex og Nettverksbyen</h1>




<p id="story"></p>




<div id="choices"></div>




<div id="stats">
Poeng: <span id="points">0</span>
</div>




<div id="networkBar">
<div id="traffic"></div>
</div>




</div>




<script>




let points = 0
let networkLoad = 20
let node = "start"








function updateUI(){




document.getElementById("points").innerText = points
document.getElementById("traffic").style.width = networkLoad + "%"




}








function setScene(text, choices){




document.getElementById("story").innerText = text




let choiceHTML = ""




choices.forEach(choice => {


choiceHTML += `<button onclick="choose('${choice.action}', ${choice.points || 0})">${choice.text}</button>`
})




document.getElementById("choices").innerHTML = choiceHTML




updateUI()




}


function choose(action, pts){


points += pts


eval(action)


}




function startGame(){




setScene(






`I denne historien så er ditt navn Alex, en nesten helt vanlig person. Du liker spesielt godt og se serier, game og scrolle på mobilen akkurat slik som andre ungdommer. En dag slutter internettet ditt og funker og ruteren blinker rødt. Du sukker frustrert, men så plutselig åpner det seg en digital portal foran deg og ut kommer en liten svevende blå skapning.
‘Hei, jeg er IP, vokteren av nettverket ditt, nettverket ditt er i kaos og bare DU kan hjelpe oss’
Direkte etter blir sugd med inn i den digitale verden.
`,




[




{text:"Bli med inn i portalen", action:"city()", points:1}




]




)


}








function city(){




networkLoad += 10




setScene(




`Med et hard smell lander du på bakken omgitt av en by full av enheter mobiler, PCer, printere og alt annet elektronisk du kan tenke deg. Ved siden av deg dukker IP opp som sier til deg “For at du skal kunne overleve her må du forstå hvordan IP-adresser fungerer. Hver enhet her har en unik ip-adresse akkurat slik som husene i din verden har en unik gateadresse” Han peker på en bygning ved siden av veien og sier 192.168.1.23. Dette er da en ipv4-adresse den er delt opp i 32 bitter. Du er helt forvirret og skjønner ingenting
IP fortsetter ‘I det siste har det flyttet inn mange nye familier her, men det gjør jo slik at ikke alle husene her kommer til å ha en unik ipv4-adresse derfor skal vi nå finne en ny løsning’
`,




[




{text:"Hjelp IP finne løsning", action:"dhcp()", points:1},




{text:"Prøv å finne veien hjem", action:"router()", points:0}




]




)




}








function dhcp(){






networkLoad += 10




setScene(




`Du sier ja og velger å prøve og hjelpe IP med å finne en måte slik at alle kan ha unike ip-adresser. Dere velger å dra til sentrum av byen for å finne ideer til hva dere kan finne på. Der møter dere en person som kaller seg selv for DHCP-mesteren og han sier at hans ansvar er og gi ulike hus ip-adresser. Han forteller om hvordan systemet nå har blitt fullt og at han ikke har mulighet til å dele ut flere ip-adresser. Han forteller også om en ny type ip-adresse som han kaller for ipv6 som skal kunne ha 128 bitter i en ip-adresse. Men han sier også at byen ikke bare handler om antall adresser og legger et kart over byen ned på bordet se her byen deres er alt for dårlig organisert.
`,




[




{text:"Bruk subnett", action:"subnet()", points:2},




{text:"Bytt til IPv6", action:"ipv6()", points:1},


{text:"La DHCP fortsette som før", action:"badEnd()", points:0}




]




)




}








function subnet(){




setScene(




`Det høres bra ut vi kan helt sikkert prøve og dele opp nettverket i mindre nettverk eller da subnett, men da har vi tre ulike valg som du må ta stilling til det er om hvilket av de under vi skal velge. Det første har lett konfigurering, men trafikken blir kaotisk. Valget nederst gir best organisering og den i midten er mellomting av begge.
`,




[




{text:"255.255.255.0 (/24)", action:"bestSubnet()", points:3},




{text:"255.255.0.0 (/16)", action:"midSubnet()", points:2},




{text:"255.0.0.0 (/8)", action:"badEnd()", points:1}




]




)




}








function bestSubnet(){




networkLoad -= 10




router()




}








function midSubnet(){








router()




}








function ipv6(){




networkLoad -= 15


setScene(


`Du op IP blir med inn på kontoret til DHCP “ipv4 adressene er overfylt". Vi kan velge å oppgradere til ipv6 som da vil gi oss 128 bit adresser og generelt mange flere adresser. Men jeg er fortsatt ikke helt sikker på hva jeg skal gjøre”`,


[
{text:"Kun bruk ipv6", action:"router()", points:3},
{text:"Ingen organisering", action:"badEnd()", points:-1},
{text:"Både ipv6 og ipv4", action:"router()", points:2}
]


)


}








function router(){




setScene(




`Du prøver å finne portalen hjem, men møter en mystisk robot på et svevende rullebrett.
 “Jeg er Router, vokteren av portalen. For å komme hjem må du først forstå IP-konflikter,” sier han.`,




[




{text:"Lær om ip-konflikter", action:"ipkonflikter()", points:2},


{text:"Gi opp", action:"badEnd()", points:-1}




]




)




}


function ipkonflikter(){




setScene(




`Routervokteren viser deg en skjerm over nettverksbyen på den kan du se to hus som blinker rødt “Begge disse husene har samme ip-adresse og det skaper ip konflikt” sier Router. DU blir nødt til å hjelpe oss med å finne en løsning fordi vi står mellom tre ulike valg og det er og bruke DHCP, sette in ip manuelt eller kan du velge og ignorere problemet. Valget er ditt.`,




[




{text:"Bruk DHCP", action:"goodEnd()", points:3},


{text:"Sett inn IP manuelt", action:"mediumEnd()", points:2},


{text:"Ignorer problemet", action:"badEnd()", points:-1}




]




)
}
function goodEnd(){


networkLoad = 10




setScene(




`Du løser ip konflikten og husene slutter å blinke rødt. Alle enheter har fått hver sin ip-adresse og hele nettverket fungerer igjen. Portalen åpner seg og du returnerer tilbake til din verden.`,




[




{text:"Spill igjen", action:"restart()"}




]




)




}








function mediumEnd(){




networkLoad = 40




setScene(




`Du greier og fikse noen problemer, men ikke i nærheten av alle. Nettverket funker men er ikke optimalisert. Portalen åpnes og du returnerer til din verden internettet ditt funker, men det er ofte tregt`,


[




{text:"Spill igjen", action:"restart()"}




]




)




}








function badEnd(){




networkLoad = 100




setScene(




`Hele nettverket ditt er i kaos, flere enheter har samme ip-adresse og portalen blir ikke åpnet så du vil sitte fast i nettverksbyen i all evighet.`,


[




{text:"Prøv igjen", action:"restart()"}




]




)




}


function restart(){




points = 0
networkLoad = 20




startGame()




}








startGame()




</script>




</body>
</html>
